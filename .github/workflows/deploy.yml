name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build static export
        working-directory: app
        env:
          # BASE_PATH is left unset: the site is served from the root of zeropointhosting.com (custom domain).
          # NEXT_PUBLIC_* vars are inlined into the client bundle at build
          # time, not read at runtime — a static export has no server to
          # read them later. Without these set here, the Deals page's
          # DEALS_ENDPOINT resolves to null and falls back to its "not
          # connected" empty state even though the Edge Function works fine.
          # The anon key is safe as a plain repo variable (not a secret):
          # it's designed to ship in the browser bundle and grants no access
          # on its own — see app/lib/deals.ts.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Disable Jekyll processing
        run: touch app/out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
