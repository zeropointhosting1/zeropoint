name: Client uptime check

on:
  schedule:
    # GitHub's scheduler isn't exact (delays are more common under load,
    # and it's disabled automatically after 60 days with no repo activity)
    # — fine for "is it still up", not a hard SLA monitor.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Check client sites
        working-directory: app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          # Repo secret, not a var — bypasses RLS, must stay private.
          # Settings -> Secrets and variables -> Actions -> New repository secret.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-clients.mjs
